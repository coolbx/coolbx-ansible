# Coolbx OS config-repo — ansible-instellingen. Werkt voor ansible-pull op het toestel én voor een
# losse `ansible-playbook local.yml --check` op een dev-machine.
[defaults]
roles_path = ./roles
inventory = inventory.yml
# YAML-uitvoer via de ingebouwde callback (geen community.general nodig op het toestel).
stdout_callback = ansible.builtin.default
interpreter_python = auto_silent
retry_files_enabled = False
localhost_warning = False

[callback_default]
result_format = yaml

[inventory]
inventory_unparsed_warning = False
