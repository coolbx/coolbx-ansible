---
# Standaardprofiel voor leerkracht-toestellen (rol "leerkracht"). Ligt bovenop profiles/basis.yml.

google_login:
  domain: edugolo.be
  search_bases:
    - dc=edugolo,dc=be
    - dc=lln,dc=edugolo,dc=be
  group_base: ou=Groups,dc=edugolo,dc=be
  allow_groups:
    - coolbx-test-personeel

flatpaks:
  - org.libreoffice.LibreOffice

# Chrome: aanmelden met het schoolaccount VERPLICHT (BrowserSignin 2). Zo dwingt Google bij de eerste
# start de wijziging van het tijdelijke wachtwoord (OTP) af; de laptop-aanmelding zelf doet dat niet (LDAP).
chrome_policies:
  BrowserSignin: 2
