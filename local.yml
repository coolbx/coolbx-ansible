---
# Coolbx OS — toestelconfig (config-repo v3, ADR-0032).
# Wordt op het toestel gedraaid door /usr/libexec/coolbx-ansible-pull (ansible-pull) met deze
# extra-vars: coolbx_role, coolbx_profile, coolbx_channel, coolbx_serial, coolbx_hostname.
# De defaults hieronder maken een losse `ansible-playbook local.yml --check` op een dev-machine mogelijk.
- name: Coolbx OS toestelconfig
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - platform
  vars:
    # Veilige defaults; het toestel overschrijft ze via -e (extra-vars winnen altijd).
    coolbx_role: onbekend
    coolbx_profile: ""
    coolbx_channel: stabiel
    coolbx_serial: ""
    coolbx_hostname: "{{ ansible_facts['hostname'] | default('localhost') }}"

  pre_tasks:
    - name: Bepaal of vault.yml bestaat
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vault.yml"
      register: coolbx_vault_stat
      become: false

    # Zonder vault-wachtwoord (bv. dev-machine) mislukt het ontcijferen; dat is oké: rollen die
    # geheimen nodig hebben slaan dan over. Op het toestel geeft coolbx-ansible-pull het wachtwoord mee.
    - name: Laad geheimen uit vault.yml (indien ontcijferbaar)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vault.yml"
      when: coolbx_vault_stat.stat.exists
      register: coolbx_vault_load
      failed_when: false
      no_log: true

    - name: Melding wanneer de vault niet geladen kon worden
      ansible.builtin.debug:
        msg: >-
          vault.yml kon niet geladen worden (geen of verkeerd vault-wachtwoord?) —
          rollen die geheimen nodig hebben (chrome-token, google-login, admin-user) slaan over.
      when:
        - coolbx_vault_stat.stat.exists
        - coolbx_vault_load.ansible_included_var_files | default([]) | length == 0

  roles:
    - role: device-identity
    - role: kiosk-apps
    - role: dconf
    - role: chrome
    - role: google-login
    - role: flatpaks
    - role: printers
    - role: admin-user
    - role: powerwash
